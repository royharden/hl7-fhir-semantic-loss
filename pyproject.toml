[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "h7loss"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1"]
[project.scripts]
h7loss = "h7loss.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/h7loss"]
